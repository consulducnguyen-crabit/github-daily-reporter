name: Collect daily GitHub data

on:
  schedule:
    - cron: '0 23 * * *' # 06:00 giờ Việt Nam; để dư thời gian cho bản tin phát lúc 07:00
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test tests/lib.test.js
      - name: Collect data
        run: node scripts/collect.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Không có thay đổi dữ liệu."
          else
            git commit -m "Update daily data"
            git push
          fi
      # Push bằng GITHUB_TOKEN không kích hoạt workflow khác, nên gọi triển khai thủ công.
      - name: Trigger Pages deploy
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
